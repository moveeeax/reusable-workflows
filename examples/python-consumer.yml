# Drop this into a Python repo as .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: moveeeax/reusable-workflows/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.11", "3.12"]'
      test-command: "pytest -q --maxfail=1"
