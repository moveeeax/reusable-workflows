name: Docker build & push (reusable)

# Reusable container pipeline: build with Buildx and (optionally) push to a
# registry with OCI labels and tags derived from git metadata.
# Call it from any repo with a Dockerfile:
#   jobs:
#     image:
#       uses: moveeeax/reusable-workflows/.github/workflows/docker.yml@v1
#       with:
#         image: ghcr.io/${{ github.repository }}
#         push: ${{ github.ref_type == 'tag' }}

on:
  workflow_call:
    inputs:
      image:
        description: "Fully qualified image name without a tag, e.g. ghcr.io/owner/name."
        type: string
        required: true
      context:
        description: "Docker build context directory."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to the Dockerfile relative to the context."
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64."
        type: string
        required: false
        default: "linux/amd64"
      push:
        description: "Push the built image to the registry (otherwise build only)."
        type: boolean
        required: false
        default: false
      registry:
        description: "Registry host to log in to when pushing (e.g. ghcr.io)."
        type: string
        required: false
        default: "ghcr.io"
    secrets:
      registry-username:
        description: "Registry username; defaults to the GitHub actor when pushing to ghcr.io."
        required: false
      registry-password:
        description: "Registry password or token; required when push is true."
        required: false

# packages: write is needed to push to ghcr.io with the job's GITHUB_TOKEN.
# GitHub Actions cannot make permissions conditional on an input, so it is
# requested on every run, including build-only runs with push: false. A
# reusable workflow can only narrow the caller's token, never widen it, so
# the calling job must grant packages: write even when it only builds.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to the registry
        if: ${{ inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
