name: Release (reusable)

# Reusable release pipeline: create a GitHub Release for the pushed tag with
# auto-generated notes and optional artifacts.
# Call it from any repo:
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       uses: moveeeax/reusable-workflows/.github/workflows/release.yml@v1

on:
  workflow_call:
    inputs:
      files:
        description: "Newline- or comma-separated globs of files to attach to the release."
        type: string
        required: false
        default: ""
      draft:
        description: "Create the release as a draft."
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark the release as a prerelease."
        type: boolean
        required: false
        default: false
      generate-notes:
        description: "Let GitHub auto-generate release notes from merged PRs."
        type: boolean
        required: false
        default: true

# Creating a release requires write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ inputs.files }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate-notes }}
