name: Terraform CI (reusable)

# Reusable Terraform pipeline: fmt check, init and validate.
# Call it from any Terraform repo:
#   jobs:
#     ci:
#       uses: moveeeax/reusable-workflows/.github/workflows/terraform.yml@v1
#       with:
#         working-directory: envs/prod

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version to install (e.g. 1.17.1)."
        type: string
        required: false
        default: "1.17.1"
      working-directory:
        description: "Directory that holds the root Terraform module."
        type: string
        required: false
        default: "."
      backend:
        description: "Pass -backend=false to `terraform init` (validate without a real backend)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend=${{ inputs.backend }}

      - name: Validate
        run: terraform validate -no-color
