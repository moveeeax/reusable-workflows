name: Terraform CI (reusable)

# Reusable Terraform pipeline: fmt check, init and validate.
# Call it from any Terraform repo:
#   jobs:
#     ci:
#       uses: moveeeax/reusable-workflows/.github/workflows/terraform.yml@v1
#       with:
#         working-directory: envs/prod

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version to install (e.g. 1.9.5)."
        type: string
        required: false
        default: "1.9.5"
      working-directory:
        description: "Directory that holds the root Terraform module."
        type: string
        required: false
        default: "."
      backend:
        description: "Pass -backend=false to `terraform init` (validate without a real backend)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend=${{ inputs.backend }}

      - name: Validate
        run: terraform validate -no-color
