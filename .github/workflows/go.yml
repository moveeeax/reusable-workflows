name: Go CI (reusable)

# Reusable Go pipeline: lint, test (race + coverage) and build.
# Call it from any Go repo:
#   jobs:
#     ci:
#       uses: moveeeax/reusable-workflows/.github/workflows/go.yml@v1
#       with:
#         go-version: "1.23"

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version to install (e.g. 1.23)."
        type: string
        required: false
        default: "1.23"
      working-directory:
        description: "Directory that holds go.mod; the module to build and test."
        type: string
        required: false
        default: "."
      test-args:
        description: "Extra flags appended to `go test` (packages default to ./...)."
        type: string
        required: false
        default: "-race -covermode=atomic -coverprofile=coverage.out ./..."
      lint:
        description: "Run golangci-lint before the tests."
        type: boolean
        required: false
        default: true
      golangci-version:
        description: "golangci-lint version to run when lint is enabled."
        type: string
        required: false
        default: "v1.60"

# Least privilege: this pipeline only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Lint
        if: ${{ inputs.lint }}
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ inputs.test-args }}
