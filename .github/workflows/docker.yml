name: Docker build & push (reusable)

# Reusable container pipeline: build with Buildx and (optionally) push to a
# registry with OCI labels and tags derived from git metadata.
# Call it from any repo with a Dockerfile:
#   jobs:
#     image:
#       uses: moveeeax/reusable-workflows/.github/workflows/docker.yml@v1
#       with:
#         image: ghcr.io/${{ github.repository }}
#         push: ${{ github.ref_type == 'tag' }}

on:
  workflow_call:
    inputs:
      image:
        description: "Fully qualified image name without a tag, e.g. ghcr.io/owner/name."
        type: string
        required: true
      context:
        description: "Docker build context directory."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to the Dockerfile relative to the context."
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64."
        type: string
        required: false
        default: "linux/amd64"
      push:
        description: "Push the built image to the registry (otherwise build only)."
        type: boolean
        required: false
        default: false
      registry:
        description: "Registry host to log in to when pushing (e.g. ghcr.io)."
        type: string
        required: false
        default: "ghcr.io"
    secrets:
      registry-username:
        description: "Registry username; defaults to the GitHub actor when pushing to ghcr.io."
        required: false
      registry-password:
        description: "Registry password or token; required when push is true."
        required: false

# Only request package write when we actually push an image.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to the registry
        if: ${{ inputs.push }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || github.token }}

      - name: Build and push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
