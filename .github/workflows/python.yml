name: Python CI (reusable)

# Reusable Python pipeline: ruff lint + pytest across a version matrix.
# Call it from any Python repo:
#   jobs:
#     ci:
#       uses: moveeeax/reusable-workflows/.github/workflows/python.yml@v1
#       with:
#         python-versions: '["3.11", "3.12"]'

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test against, e.g. ["3.11","3.12"].'
        type: string
        required: false
        default: '["3.12"]'
      working-directory:
        description: "Directory to run lint and tests from."
        type: string
        required: false
        default: "."
      install:
        description: "Bash command that installs the project and its dev dependencies. It runs as code: never build it from untrusted context such as PR titles or branch names."
        type: string
        required: false
        default: "pip install -e '.[dev]' || pip install -r requirements.txt"
      lint:
        description: "Run ruff before the tests."
        type: boolean
        required: false
        default: true
      test-command:
        description: "Bash command that runs the test suite. It runs as code: never build it from untrusted context such as PR titles or branch names."
        type: string
        required: false
        default: "pytest -q"
      ruff-version:
        description: "Exact ruff version to install for the lint step (pinned for reproducible lint results)."
        type: string
        required: false
        default: "0.17.3"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # install and test-command are shell commands by contract (the default
      # install uses ||), so they are eval'ed. They reach the shell through
      # env instead of being expanded into the script text, which keeps the
      # step script fixed and parses the value exactly as before.
      - name: Install
        run: eval "${INSTALL_COMMAND}"
        env:
          INSTALL_COMMAND: ${{ inputs.install }}

      - name: Lint
        if: ${{ inputs.lint }}
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff check .
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}

      - name: Test
        run: eval "${TEST_COMMAND}"
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
