name: SBOM (reusable)

# Reusable SBOM pipeline: generate an SPDX software bill of materials for a
# directory or a built image and upload it as a build artifact.
# Call it from any repo:
#   jobs:
#     sbom:
#       uses: moveeeax/reusable-workflows/.github/workflows/sbom.yml@v1
#       with:
#         path: .

on:
  workflow_call:
    inputs:
      path:
        description: "Directory to scan for dependencies (mutually exclusive with image)."
        type: string
        required: false
        default: "."
      image:
        description: "Container image to scan instead of a directory (e.g. ghcr.io/owner/name:tag)."
        type: string
        required: false
        default: ""
      format:
        description: "SBOM output format understood by syft (spdx-json, cyclonedx-json, ...)."
        type: string
        required: false
        default: "spdx-json"
      artifact-name:
        description: "Name of the uploaded SBOM artifact."
        type: string
        required: false
        default: "sbom"

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ inputs.image == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ inputs.image == '' && inputs.path || '' }}
          image: ${{ inputs.image }}
          format: ${{ inputs.format }}
          output-file: sbom.${{ inputs.format }}
          artifact-name: ${{ inputs.artifact-name }}.${{ inputs.format }}

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: sbom.${{ inputs.format }}
          if-no-files-found: error
