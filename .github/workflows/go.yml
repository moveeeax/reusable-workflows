name: Go CI (reusable)

# Reusable Go pipeline: lint, test (race + coverage) and build.
# Call it from any Go repo:
#   jobs:
#     ci:
#       uses: moveeeax/reusable-workflows/.github/workflows/go.yml@v1
#       with:
#         go-version: "1.27"

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version to install (e.g. 1.27)."
        type: string
        required: false
        default: "1.27"
      working-directory:
        description: "Directory that holds go.mod; the module to build and test."
        type: string
        required: false
        default: "."
      test-args:
        description: "Extra flags appended to `go test` (packages default to ./...)."
        type: string
        required: false
        default: "-race -covermode=atomic -coverprofile=coverage.out ./..."
      lint:
        description: "Run golangci-lint before the tests."
        type: boolean
        required: false
        default: true
      golangci-version:
        description: "golangci-lint v2 version to run when lint is enabled (v1 configs must be migrated, see README)."
        type: string
        required: false
        default: "v2.15.0"

# Least privilege: this pipeline only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Lint
        if: ${{ inputs.lint }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ inputs.test-args }}
