name: CI

# This repo's own CI. It does not consume the library — it *validates* it:
# every reusable workflow and example is checked for workflow_call, documented
# inputs, SHA-pinned actions and least-privilege permissions, then the pytest
# suite runs. Executes on GitHub-hosted ubuntu-latest runners.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-venv

      - name: Set up virtualenv
        run: |
          set -eux
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate workflow library
        run: |
          set -eux
          . .venv/bin/activate
          python3 tools/validate.py

      - name: Run tests
        run: |
          set -eux
          . .venv/bin/activate
          pytest -q

  # Run the audit workflow against this repo itself, so a change to audit.yml
  # is exercised end to end. Findings are reported but do not fail CI; fork
  # PRs cannot upload SARIF, so they get annotations instead.
  audit:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/audit.yml
    with:
      fail-on-findings: false
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
